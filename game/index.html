<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay 3D — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a33; font-family: 'Segoe UI', Arial, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #hud-money { font-size: 30px; font-weight: 800; color: #7dff8a; }
  #hud-district { font-size: 15px; opacity: .9; }
  #hud-clock { font-size: 15px; opacity: .9; }
  #hud-stars { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 4px; }
  #hud-bars { position: absolute; right: 16px; top: 14px; width: 200px; }
  .bar { position: relative; height: 16px; background: rgba(0,0,0,.55); border: 1px solid #fff3; margin-bottom: 5px; }
  .bar div { height: 100%; }
  #bar-health { background: #37d67a; width: 100%; }
  #bar-armour { background: #4a8aff; width: 0%; }
  .bar span { position: absolute; right: 4px; top: 0; font-size: 10px; line-height: 16px; letter-spacing: 1px; }
  #hud-weapon { position: absolute; right: 16px; top: 74px; font-size: 16px; font-weight: 700; }
  #hud-speed { position: absolute; right: 16px; bottom: 210px; font-size: 26px; font-weight: 800; }
  #hud-mission { position: absolute; left: 16px; bottom: 16px; max-width: 420px; font-size: 15px; background: rgba(0,0,0,.55); padding: 8px 12px; border-left: 4px solid #ffd23d; }
  #hud-radio { position: absolute; left: 16px; top: 110px; font-size: 13px; background: rgba(0,0,0,.45); padding: 4px 8px; }
  #hud-message { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; color: #ffd23d; }
  #hud-hint { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(0,0,0,.5); padding: 5px 10px; }
  #hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; display: none; }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); }
  #hud-dialogue { position: absolute; bottom: 210px; left: 16px; max-width: 480px; font-size: 15px; background: rgba(0,0,0,.65); padding: 10px 12px; border-left: 4px solid #4a8aff; }
  #hud-dialogue:empty { display: none; }
  #hud-shop { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  #hud-menu { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,10,25,.55); }
  #hud-menu:empty { display: none; }
  .panel { background: rgba(10,16,32,.92); border: 1px solid #ffd23d55; padding: 22px 28px; min-width: 340px; max-width: 560px; }
  .panel.big { text-align: center; }
  .panel h1 { margin: 0 0 10px; color: #ffd23d; letter-spacing: 2px; }
  .panel h3 { margin: 0 0 10px; color: #ffd23d; }
  .panel p { line-height: 1.5; }
  .panel .dim { opacity: .75; font-size: 13px; }
  .shop-row { padding: 6px 8px; }
  .shop-row.sel { background: #ffd23d; color: #111; }
  .shop-row span { opacity: .7; font-size: 12px; }
  .panel-foot { margin-top: 10px; font-size: 13px; opacity: .8; }
  #autoplay-result { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay 3D: an open-world crime game. Drive, explore, and complete missions in Solmar Bay."></canvas>
<div id="hud"></div>
<div id="autoplay-result"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
